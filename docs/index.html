<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Sensemaking Journey</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A blog for the truth-seeker">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="./dark.css" />
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"> -->
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
            name: 'A Sensemaking Journey',
            repo: '',
            loadSidebar: true,
            subMaxLevel: 3,
            mustache: {
                // no package.json in docs/, and the plugin's failed load would gate the first render
                noPackage: true
            }
        }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- front-matter strips the YAML block and fills vm.frontmatter; docsify-mustache reads that to expand {{title}}/{{date}} -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/front-matter.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mustache"></script>
</body>
</html>
